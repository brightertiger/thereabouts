# Limits match the retained engines; execution uses shared resource admission.
minimum_country_coverage: 0.995
# Batch and row-group sizes shape outputs, so they are part of stage identities.
batches:
  edge_segments: 64
  offshore_batch_rows: 128
  state_vote_batch_rows: 1024
  parquet_batch_rows: 1024
  source_batch_rows: 512
  extract_row_group_rows: 2048
  join_row_group_rows: 16384
  mapping_batch_rows: 2048
  allocation_batch_rows: 1024
# Caches, spill and reservations only tune a machine; they are never hashed.
runtime:
  city_cache_entries: 2
  geometry_cache_entries: 24
  large_geometry_bytes: 100000
  nearest_cache_entries: 3
  column_cache_entries: 96
  reader_cache_entries: 24
  sqlite_cache_kib: 16384
  locator_cache_kib: 2048
  duckdb_spill_bytes: 512000000
  country_reservation_bytes: 256000000
  block_reservation_bytes: 64000000
  lookup_reservation_bytes: 512000000
land_source: osm_land
urban_source: ghsl
registration_source: plates
plate_country_source: plate_country
reconcile_sources:
  overture: [areas, places]
  geonames: [places, names]
  geoboundaries: [areas]
  osm_land: [areas]
static_sources:
  countries: codes
  subdivisions: codes
  phone_metadata: phone
  phone_prefixes: phone
  timezone_cells: timezones
  zone_tables: timezones
spatial_sources:
  postal_codes: postal
  airports: airports
  trade_locations: unlocode
  ip_ranges: dbip

# Byte budgets are decimal. Source settings are merged from config/sources/*.yaml.
paths:
  root: data
storage:
  local: file://
resources:
  duckdb_memory: 1GB
  duckdb_threads: 1
  workers: 1
  # Resident bytes per worker; the process may hold rss_limit * workers.
  rss_limit: 2000000000
  disk_floor: 5000000000
  max_workspace: 60000000000
  poll_seconds: 10
  ledger_timeout_seconds: 30
  workspace_scan_seconds: 60
  # Admission fails with a clear error after this wait instead of pausing forever.
  admission_timeout_seconds: 1800
h3:
  block_resolution: 3
  cell_resolution: 8
# Every stage declares its entry modules and the native libraries it reads; its
# identity hashes the entry modules' import closure.
stages:
  - name: download
    packages: [pipeline/stages/sources.py]
    config: []
  - name: normalize
    needs: [download]
    packages: [pipeline/stages/sources.py]
    config: [h3]
    native: [duckdb, shapely, h3, pyarrow, pyshp, numpy, regex, sqlite3]
  - name: reconcile
    needs:
    - normalize
    packages: [pipeline/stages/reconcile.py]
    native:
    - sqlite3
    - duckdb
    - shapely
    - h3
    - numpy
    - scipy
    - pyarrow
    config:
    - engines
    - h3
  - name: cells
    needs:
    - reconcile
    packages: [pipeline/stages/cells.py]
    config:
    - engines
    - h3
    native:
    - sqlite3
    - duckdb
    - shapely
    - h3
    - numpy
    - scipy
    - pyarrow
    cell_format: true
  - name: cities
    needs:
    - reconcile
    - normalize
    packages: [pipeline/stages/cities.py]
    native:
    - sqlite3
    - duckdb
    - shapely
    - h3
    - numpy
    - scipy
    - pyarrow
    config:
    - engines
    - h3
  - name: evaluate
    needs:
    - cells
    - cities
    packages: [pipeline/stages/evaluate.py]
    config:
    - engines
    - h3
    native:
    - sqlite3
    - duckdb
    - shapely
    - h3
    - numpy
    - scipy
    - pyarrow
  - name: normalize_cells
    needs:
    - cells
    - cities
    - evaluate
    packages: [pipeline/stages/normalize_cells.py]
    config:
    - engines
    - h3
    native:
    - sqlite3
    - duckdb
    - shapely
    - h3
    - numpy
    - scipy
    - pyarrow
    cell_format: true
  - name: lookups
    needs:
    - normalize
    - normalize_cells
    - plate_country
    packages: [pipeline/stages/lookups.py]
    native:
    - sqlite3
    - duckdb
    - shapely
    - h3
    - numpy
    - scipy
    - pyarrow
    config:
    - engines
    - h3
  - name: plate_country
    needs: [normalize]
    packages: [pipeline/stages/plate_country.py, pipeline/stages/geographic.py,
               pipeline/stages/engine_discovery.py, pipeline/stages/engine_recipes.py,
               pipeline/stages/engine_data.py, pipeline/stages/engine_io.py,
               pipeline/engines/plate_country, pipeline/engines/artifact_io.py,
               pipeline/config/policies.py, pipeline/sources/plates]
    config: [engines]
    native: [pyarrow, regex]

  - name: dataset
    needs: [lookups]
    packages: [pipeline/stages/dataset.py]
    config: [h3, content]
    native: [pyarrow, h3]
    cell_format: true
  - name: packs
    needs: [dataset]
    packages: [pipeline/stages/packs.py]
    config: []
    native: [thereabouts]
    cell_format: true
  - name: publish
    needs: [dataset, packs]
    packages: [pipeline/stages/publish.py]
    config: []
    native: [fsspec]

# The full-world proof used 250k-row sorting runs at 541 MB RSS.
content:
  batch_rows: 1024
  chunk_rows: 250000
  merge_fan_in: 64
  write_buffer_bytes: 1048576

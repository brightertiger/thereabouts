boundary_evidence:
  reason: Territorial locality polygons own their settlement interiors regardless
    local city/town/village/hamlet title. Point-only weak village seats do not qualify.
    Either linked source anchor may validate a footprint. The alternate anchor is
    used only when the primary anchor is within 250 m of the boundary, preventing
    distant namesake links from assigning a city a tiny village footprint. Overlaps
    retain the source municipal precedence among accepted boundaries.
  reference: Acquired Overture division_area is_territorial, subtype, linked division
    class and coordinates; GeoNames settlement coordinates.
boundary_anchor_edge_m: 250

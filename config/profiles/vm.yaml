# e2-standard-8: 8 vCPUs, 32 GB memory, 15 GB swap, 300 GB pd-balanced disk.
paths:
  root: /mnt/data
resources:
  # Worker processes; one vCPU stays with the runner (ledger, receipts, admission).
  workers: 7
  executor: process
  # Each worker's DuckDB connection; ORDER BY keeps outputs independent of threads.
  duckdb_memory: 2GB
  duckdb_threads: 1
  # Per worker: the runner and its workers may hold rss_limit * workers (26.6 GB
  # of PSS), leaving room for the page cache and the parent.
  rss_limit: 3800000000
  max_workspace: 250000000000
  disk_floor: 5000000000

engines:
  runtime:
    # World-scale spatial joins (postal) spill well past the 512 MB default; not hashed.
    duckdb_spill_bytes: 40000000000

storage:
  gcs_raw: gs://pyofflinegeocoder-summer-sector-488705-m8/raw
release:
  dataset:
    max_output_bytes: ${resources.max_workspace}

  metadata:
    attribution: GeoNames
    license: CC-BY-4.0
    license_url: https://creativecommons.org/licenses/by/4.0/
- name: country-codes.csv
  url: https://raw.githubusercontent.com/datasets/country-codes/{countries}/data/country-codes.csv
  metadata:
    attribution: DataHub; UN Statistics Division; GeoNames; CLDR
    license: PDDL-1.0
    license_url: https://opendatacommons.org/licenses/pddl/1-0/
- name: countryInfo.txt
  url: https://download.geonames.org/export/dump/countryInfo.txt

    meaning: The sovereign country place; null when not applicable
  - columns: [normalized_city_id]
    references: {table: places, columns: [place_id]}
    meaning: The city or settlement representing this place, as in place_to_city.city_id
  columns:
  - name: place_id
    type: string
    nullable: true

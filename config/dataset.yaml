phone_prefixes:
  description: 'libphonenumber geographic prefix descriptions: the place a telephone
    prefix belongs to, in each published language. Shared calling codes keep every candidate
    country.'
  grain: One row per prefix description in one language file, so a prefix repeats once
    per language.
  primary_key: []

    type: 'list<element: string>'
    nullable: true
    meaning: All candidate place identifiers; ambiguity is preserved
    units: none
place_to_city:
  description: The reviewed mapping from every place to the city or standalone settlement
    that represents it. Use it to roll places up to canonical cities.
  grain: One row per place; every places row has exactly one mapping row.
  primary_key:
  - place_id
  relationships:
  - columns: [place_id]
    references: {table: places, columns: [place_id]}
    meaning: The mapped place
  - columns: [city_id]
    references: {table: places, columns: [place_id]}
    meaning: The representing city or settlement; null for non-settlements
  columns:
  - name: place_id
    type: string
    nullable: false
    meaning: Reconciled place identifier
    units: none
  - name: city_id
    type: string
    nullable: true
    meaning: Selected settlement place ID, including standalone rural settlements;
      null if unassigned
    units: none
  - name: method
    type: string
    nullable: false
    meaning: 'Mapping rule: self, spatial_absorption, policy_part, identity_alias
      or non_settlement'
    units: none
    values:
    - value: self
      meaning: 'The place is its own city: a canonical city, or a settlement that no city
        absorbs'
    - value: spatial_absorption
      meaning: The settlement lies inside a canonical city's extent and maps to that city
    - value: policy_part
      meaning: Country policy names the place as a part of a city and maps it there
    - value: identity_alias
      meaning: Country policy declares the place another identity of the same city
    - value: non_settlement
      meaning: 'A country, state or district: not a settlement, so city_id is null'
    values_from:
    - pipeline/engines/cities/mapping.py
  - name: evidence
    type: string
    nullable: true
    meaning: JSON evidence supporting the allocation
    units: none
places:
  description: 'The reconciled place catalogue behind every identifier: countries, subdivisions,
    canonical cities and towns, other settlements and districts, with names, population
    and provenance. Treat place identifiers as opaque and do not compare them across
    releases.'
  grain: One row per reconciled place.
  primary_key:
  - place_id
  relationships:
  - columns: [parent_id]
    references: {table: places, columns: [place_id]}
    meaning: The parent place (country or subdivision); null when none was selected
  - columns: [sovereign_id]

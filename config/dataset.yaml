# Public schemas measured from the retained normalized dataset.
# Nullability is physical Arrow nullability.
airports:
  description: Airports and airfields from OurAirports, placed on the H3 grid and joined
    to the cell geography at their coordinates.
  grain: One row per airport record in the pinned OurAirports file; duplicate observations
    are retained.
  primary_key: []
  relationships:
  - columns: [country_id]
    references: {table: places, columns: [place_id]}
    meaning: The country place of the cell the point falls in; null when the row is
      unlocated or unassigned
  - columns: [state_id]
    references: {table: places, columns: [place_id]}
    meaning: The first-level subdivision place of that cell; null when none is assigned
  - columns: [city_id]
    references: {table: places, columns: [place_id]}
    meaning: The selected settlement of that cell, a canonical city or a standalone
      rural settlement; null when none is assigned
  columns:
  - name: source
    type: string
    nullable: true
    meaning: Configured upstream source name
    units: none
  - name: source_id
    type: string
    nullable: true
    meaning: Identifier of the original observation within its source
    units: none
  - name: ident
    type: string
    nullable: true
    meaning: OurAirports airport identifier
    units: none
  - name: iata_code
    type: string
    nullable: true
    meaning: IATA airport code, where available
    units: none
  - name: icao_code
    type: string
    nullable: true
    meaning: ICAO airport code, where available
    units: none
  - name: gps_code
    type: string
    nullable: true
    meaning: Source GPS airport code
    units: none
  - name: local_code
    type: string
    nullable: true
    meaning: Local airport code
    units: none
  - name: type
    type: string
    nullable: true
    meaning: Source-specific entity classification
    units: none
  - name: name
    type: string
    nullable: true
    meaning: Preferred display name
    units: none
  - name: municipality
    type: string
    nullable: true
    meaning: Source municipality text
    units: none
  - name: country_code
    type: string
    nullable: true
    meaning: Source or reconciled ISO-like two-letter country code
    units: none
  - name: region_code
    type: string
    nullable: true
    meaning: Source region or subdivision code
    units: none
  - name: latitude
    type: double
    nullable: true
    meaning: WGS84 latitude; positive north
    units: degrees north
  - name: longitude
    type: double
    nullable: true
    meaning: WGS84 longitude; positive east
    units: degrees east
  - name: h3
    type: string
    nullable: true
    meaning: Lowercase hexadecimal H3 cell index, without 0x
    units: none
  - name: h3_uint64
    type: uint64
    nullable: true
    meaning: Same H3 index as an unsigned 64-bit integer
    units: none
  - name: h3_resolution
    type: uint8
    nullable: true
    meaning: Resolution of this stored H3 index
    units: H3 level
  - name: source_release
    type: string
    nullable: true
    meaning: Pinned upstream release or inventory identifier
    units: none
  - name: license
    type: string
    nullable: true
    meaning: Upstream licence identifier
    units: none
  - name: provenance
    type: string
    nullable: true
    meaning: JSON source evidence and transformation provenance
    units: none
  - name: country_id
    type: string
    nullable: true
    meaning: Reconciled country place identifier
    units: none
  - name: state_id
    type: string
    nullable: true
    meaning: Reconciled first-level subdivision place identifier
    units: none
  - name: city_id
    type: string
    nullable: true
    meaning: Selected settlement place ID, including standalone rural settlements;
      null if unassigned
    units: none
  - name: cell_country_code
    type: string
    nullable: true
    meaning: Country code assigned by the geographic cell join
    units: none
  - name: cell_status
    type: string
    nullable: true
    meaning: 'Cell join status: matched, unassigned, ineligible, pending or unlocated'
    units: none
    values:
    - value: matched
      meaning: The point's cell is stored and has a country assignment
    - value: unassigned
      meaning: The cell is stored but no country is assigned to it
    - value: ineligible
      meaning: The cell is outside the stored land and near-shore coverage
    - value: pending
      meaning: No cell data exists for the point's block in this release, so no decision
        was made
    - value: unlocated
      meaning: The row has no coordinates, so there is no cell to join
    values_from:
    - pipeline/engines/cells/joins.py
    - pipeline/engines/cells/reader.py
    - pipeline/stages/lookups.py
  - name: country_disagrees
    type: bool
    nullable: true
    meaning: Whether source and cell country codes disagree; null if not comparable
    units: none
canonical_cities:
  description: 'The cities and towns that can absorb other settlements, the anchors
    for urban areas. Reverse lookups can also return standalone villages and other
    rural settlements, which are in places but not here.'
  grain: One row per canonical city or town; city_id is the place identifier of its
    anchor.
  primary_key:
  - city_id
  relationships:
  - columns: [city_id]
    references: {table: places, columns: [place_id]}
    meaning: The anchor place of the canonical city
  - columns: [place_id]
    references: {table: places, columns: [place_id]}
    meaning: The reconciled place of the canonical city; equal to city_id
  columns:
  - name: city_id
    type: string
    nullable: false
    meaning: Canonical city/town anchor ID
    units: none
  - name: place_id
    type: string
    nullable: false
    meaning: Reconciled place identifier
    units: none
  - name: country_code
    type: string
    nullable: false
    meaning: Source or reconciled ISO-like two-letter country code
    units: none
  - name: kind
    type: string
    nullable: false
    meaning: Canonical settlement kind
    units: none
    values:
    - value: city
      meaning: 'A city: classified as a city by the source, or with a population of at
        least 100,000'
    - value: town
      meaning: A town that is not classified as a city and has a smaller population
    values_from:
    - pipeline/engines/cities/candidates.py
  - name: name
    type: string
    nullable: false
    meaning: Preferred display name
    units: none
  - name: eligibility
    type: string
    nullable: false
    meaning: Evidence qualifying this place as a canonical city
    units: none
    values:
    - value: typed town/city and seat or population
      meaning: Classified as a town or city by the source, and either a seat feature code
        or a population at or above the typed minimum
    - value: population and active settlement
      meaning: Population at or above the policy minimum, and a feature code that the
        policy does not exclude
    - value: national or first-order seat
      meaning: A national capital or first-order administrative seat feature code
    - value: explicit country policy
      meaning: Named by the country's city policy
    - value: linked city overrides section code
      meaning: A source city classification overrides the section feature code that would
        exclude it
    values_from:
    - pipeline/engines/cities/candidates.py
  - name: name_en
    type: string
    nullable: true
    meaning: Preferred name only when its provenance explicitly identifies English
    units: none
  - name: latitude
    type: double
    nullable: false
    meaning: WGS84 latitude; positive north
    units: degrees north
  - name: longitude
    type: double
    nullable: false
    meaning: WGS84 longitude; positive east
    units: degrees east
  - name: population
    type: int64
    nullable: true
    meaning: Source population estimate, not a current census assertion
    units: people
  - name: source_ids
    type: string
    nullable: false
    meaning: JSON list of contributing source identifiers
    units: none
  - name: footprint_references
    type: string
    nullable: false
    meaning: JSON references to source settlement footprints
    units: none
  - name: allocation_rule
    type: string
    nullable: false
    meaning: Rule used to allocate this canonical settlement
    units: none
    values:
    - value: bounded
      meaning: The city has accepted boundary footprints that own the cells inside them
    - value: urban_allocation; optional town_radius
      meaning: 'No boundary: the city receives urban cells by allocation and, when enabled,
        cells within its town radius'
    values_from:
    - pipeline/engines/cities/build.py
cells:
  description: 'Reverse-geocoding labels for land and the retained near-shore band on
    the H3 grid: country, subdivision and city, with the evidence behind each. Cells
    are losslessly compacted, so a row can stand for many resolution 8 cells.'
  grain: 'One row per stored H3 cell: a resolution 8 cell, or a coarser ancestor (resolution
    3 to 7) that stands for all its resolution 8 descendants when they share one label.'
  primary_key:
  - h3_uint64
  relationships:
  - columns: [country_id]
    references: {table: places, columns: [place_id]}
    meaning: The country place of the cell; null when no country is assigned
  - columns: [state_id]
    references: {table: places, columns: [place_id]}
    meaning: The first-level subdivision place of the cell; null when none is assigned
  - columns: [city_id]
    references: {table: places, columns: [place_id]}
    meaning: The selected settlement of the cell, a canonical city or a standalone rural
      settlement; null when none is assigned
  columns:
  - name: h3
    type: string
    nullable: false
    meaning: Lowercase hexadecimal H3 cell index, without 0x
    units: none
  - name: h3_uint64
    type: uint64
    nullable: false
    meaning: Same H3 index as an unsigned 64-bit integer
    units: none
  - name: h3_resolution
    type: uint8
    nullable: false
    meaning: Resolution of this stored H3 index
    units: H3 level
  - name: country_id
    type: string
    nullable: true
    meaning: Reconciled country place identifier
    units: none
  - name: state_id
    type: string
    nullable: true
    meaning: Reconciled first-level subdivision place identifier
    units: none
  - name: city_id
    type: string
    nullable: true
    meaning: Selected settlement place ID, including standalone rural settlements;
      null if unassigned
    units: none
  - name: country_method
    type: string
    nullable: true
    meaning: 'Country assignment evidence: area, or null when absent'
    units: none
    values:
    - value: area
      meaning: The cell centre lies inside the country's boundary area
    values_from:
    - pipeline/engines/normalize_cells/blocks.py
  - name: state_method
    type: string
    nullable: true
    meaning: 'Subdivision assignment evidence: area, or null when absent'
    units: none
    values:
    - value: area
      meaning: The cell centre lies inside the subdivision's boundary area
    values_from:
    - pipeline/engines/normalize_cells/blocks.py
  - name: city_method
    type: string
    nullable: true
    meaning: Canonical city allocation rule, including distant-nearest classification
    units: none
    values:
    - value: city_polygon
      meaning: Inside an accepted municipal footprint polygon of a canonical city
    - value: policy_polygon
      meaning: Inside an area that country policy assigns to one city
    - value: urban_allocation
      meaning: An urban cell outside any footprint, allocated to a canonical city of its
        urban cluster
    - value: town_radius
      meaning: A rural cell within a qualifying town's own radius; an optional rule that
        policy can disable
    - value: rural_polygon
      meaning: Inside the boundary polygon of a standalone rural settlement
    - value: rural_nearest
      meaning: No polygon covers the cell; the nearest settlement within the distant threshold
    - value: rural_nearest_distant
      meaning: The nearest settlement is farther than the distant threshold and within
        the nearest cutoff; treat the city as approximate
    values_from:
    - core/thereabouts-core/src/reverse/mod.rs
    - pipeline/engines/cities/engine.py
    - pipeline/engines/cities/allocation.py
    - pipeline/engines/cities/footprints.py
    - pipeline/engines/cities/rural.py
  - name: land_method
    type: string
    nullable: true
    meaning: 'Land eligibility evidence: land or offshore'
    units: none
    values:
    - value: land
      meaning: The cell centre is on land
    - value: offshore
      meaning: A retained near-shore water cell whose assignment is projected from nearby
        land
    values_from:
    - pipeline/engines/reconcile/land.py
    - core/thereabouts-core/src/reverse/mod.rs
countries:
  description: Countries and territories with ISO 3166 codes, names, currency, languages,
    calling code and UN M49 regions, from the pinned country-codes file plus GeoNames
    country information, linked to the reconciled country place.
  grain: One row per country or territory record in the pinned sources; observations
    can repeat.
  primary_key: []
  relationships:
  - columns: [country_id]
    references: {table: places, columns: [place_id]}
    meaning: The country place named by the row's country code; null when the code matches
      no place
  - columns: [place_id]
    references: {table: places, columns: [place_id]}
    meaning: The single place the row resolves to; null when the link is ambiguous,
      unmatched or pending
  columns:
  - name: source
    type: string
    nullable: false
    meaning: Configured upstream source name
    units: none
  - name: source_id
    type: string
    nullable: false
    meaning: Identifier of the original observation within its source
    units: none
  - name: country_code
    type: string
    nullable: true
    meaning: Source or reconciled ISO-like two-letter country code
    units: none
  - name: alpha3
    type: string
    nullable: true
    meaning: ISO alpha-3 country code
    units: none
  - name: numeric
    type: string
    nullable: true
    meaning: ISO numeric country code represented as text
    units: none
  - name: name
    type: string
    nullable: true
    meaning: Preferred display name
    units: none
  - name: calling_code
    type: string
    nullable: true
    meaning: International telephone calling code, represented as text
    units: none
  - name: currency
    type: string
    nullable: true
    meaning: Source currency code
    units: none
  - name: languages
    type: string
    nullable: true
    meaning: Source language codes
    units: none
  - name: tld
    type: string
    nullable: true
    meaning: Country internet top-level domain
    units: none
  - name: continent
    type: string
    nullable: true
    meaning: Source continent identifier
    units: none
  - name: m49
    type: string
    nullable: true
    meaning: UN M49 area code
    units: none
  - name: region_code
    type: string
    nullable: true
    meaning: Source region or subdivision code
    units: none
  - name: region_name
    type: string
    nullable: true
    meaning: UN region name
    units: none
  - name: subregion_code
    type: string
    nullable: true
    meaning: UN subregion code
    units: none
  - name: subregion_name
    type: string
    nullable: true
    meaning: UN subregion name
    units: none
  - name: intermediate_region_code
    type: string
    nullable: true
    meaning: UN intermediate region code
    units: none
  - name: intermediate_region_name
    type: string
    nullable: true
    meaning: UN intermediate region name
    units: none
  - name: source_release
    type: string
    nullable: false
    meaning: Pinned upstream release or inventory identifier
    units: none
  - name: license
    type: string
    nullable: false
    meaning: Upstream licence identifier
    units: none
  - name: provenance
    type: string
    nullable: false
    meaning: JSON source evidence and transformation provenance
    units: none
  - name: country_id
    type: string
    nullable: true
    meaning: Reconciled country place identifier
    units: none
  - name: place_id
    type: string
    nullable: true
    meaning: Uniquely matched reconciled place; null for ambiguous or unmatched observations
    units: none
  - name: link_status
    type: string
    nullable: true
    meaning: 'Identifier link status: matched, ambiguous, unmatched or pending'
    units: none
    values:
    - value: matched
      meaning: Exactly one candidate place; place_id is set
    - value: ambiguous
      meaning: Several candidate places; all are in place_ids and place_id is null
    - value: unmatched
      meaning: No candidate place was found
    - value: pending
      meaning: The row refers to a country that is expected in the release but was not
        reconciled in this build
    values_from:
    - pipeline/engines/cells/code_links.py
  - name: link_method
    type: string
    nullable: true
    meaning: Rule used for the identifier link
    units: none
    values:
    - value: source country code
      meaning: The row's own country code identifies the country
    - value: explicit code or administrative crosswalk
      meaning: The published subdivision code maps to a place through the code crosswalk
    - value: GeoNames administrative identity
      meaning: The row's GeoNames identifier identifies the place
    - value: exact country-scoped administrative alias
      meaning: The normalized name equals a place alias within the same country
    - value: source-qualified administrative alias
      meaning: A name qualified by its source administrative context equals a place alias
    - value: territory fixed-line prefix language
      meaning: Candidate countries were narrowed by the territory's fixed-line numbering
        pattern
    - value: no numbering-pattern support; retained source candidates
      meaning: No numbering pattern could narrow the candidates, so every source country
        is kept
    values_from:
    - pipeline/engines/cells/code_links.py
    - pipeline/engines/cells/phone.py
  - name: place_ids
    type: 'list<element: string>'
    nullable: true
    meaning: All candidate place identifiers; ambiguity is preserved
    units: none
ip_ranges:
  description: IPv4 and IPv6 geolocation intervals from DB-IP City Lite, each with a
    published point joined to the cell geography. The ip pack writer rejects overlapping
    intervals.
  grain: One row per published IP interval, from ip_start to ip_end inclusive.
  primary_key: []
  relationships:
  - columns: [country_id]
    references: {table: places, columns: [place_id]}
    meaning: The country place of the cell the point falls in; null when the row is
      unlocated or unassigned
  - columns: [state_id]
    references: {table: places, columns: [place_id]}
    meaning: The first-level subdivision place of that cell; null when none is assigned
  - columns: [city_id]
    references: {table: places, columns: [place_id]}
    meaning: The selected settlement of that cell, a canonical city or a standalone
      rural settlement; null when none is assigned
  columns:
  - name: source
    type: string
    nullable: true
    meaning: Configured upstream source name
    units: none
  - name: source_id
    type: string
    nullable: true
    meaning: Identifier of the original observation within its source
    units: none
  - name: ip_start
    type: string
    nullable: true
    meaning: Inclusive first IP address as text
    units: none
  - name: ip_end
    type: string
    nullable: true
    meaning: Inclusive last IP address as text
    units: none
  - name: country_code
    type: string
    nullable: true
    meaning: Source or reconciled ISO-like two-letter country code
    units: none
  - name: region
    type: string
    nullable: true
    meaning: Source region name
    units: none
  - name: city
    type: string
    nullable: true
    meaning: Source city name; retained independently of the canonical city
    units: none
  - name: ip_version
    type: uint8
    nullable: true
    meaning: IP address family, 4 or 6
    units: address family
  - name: ip_start_packed
    type: binary
    nullable: true
    meaning: Inclusive first address, 16-byte big-endian binary; IPv4 is left zero-padded
    units: none
  - name: ip_end_packed
    type: binary
    nullable: true
    meaning: Inclusive last address, 16-byte big-endian binary; IPv4 is left zero-padded
    units: none
  - name: latitude
    type: double
    nullable: true
    meaning: WGS84 latitude; positive north
    units: degrees north
  - name: longitude
    type: double
    nullable: true
    meaning: WGS84 longitude; positive east
    units: degrees east
  - name: h3
    type: string
    nullable: true
    meaning: Lowercase hexadecimal H3 cell index, without 0x
    units: none
  - name: h3_uint64
    type: uint64
    nullable: true
    meaning: Same H3 index as an unsigned 64-bit integer
    units: none
  - name: h3_resolution
    type: uint8
    nullable: true
    meaning: Resolution of this stored H3 index
    units: H3 level
  - name: source_release
    type: string
    nullable: true
    meaning: Pinned upstream release or inventory identifier
    units: none
  - name: license
    type: string
    nullable: true
    meaning: Upstream licence identifier
    units: none
  - name: provenance
    type: string
    nullable: true
    meaning: JSON source evidence and transformation provenance
    units: none
  - name: country_id
    type: string
    nullable: true
    meaning: Reconciled country place identifier
    units: none
  - name: state_id
    type: string
    nullable: true
    meaning: Reconciled first-level subdivision place identifier
    units: none
  - name: city_id
    type: string
    nullable: true
    meaning: Selected settlement place ID, including standalone rural settlements;
      null if unassigned
    units: none
  - name: cell_country_code
    type: string
    nullable: true
    meaning: Country code assigned by the geographic cell join
    units: none
  - name: cell_status
    type: string
    nullable: true
    meaning: 'Cell join status: matched, unassigned, ineligible, pending or unlocated'
    units: none
    values:
    - value: matched
      meaning: The point's cell is stored and has a country assignment
    - value: unassigned
      meaning: The cell is stored but no country is assigned to it
    - value: ineligible
      meaning: The cell is outside the stored land and near-shore coverage
    - value: pending
      meaning: No cell data exists for the point's block in this release, so no decision
        was made
    - value: unlocated
      meaning: The row has no coordinates, so there is no cell to join
    values_from:
    - pipeline/engines/cells/joins.py
    - pipeline/engines/cells/reader.py
    - pipeline/stages/lookups.py
  - name: country_disagrees
    type: bool
    nullable: true
    meaning: Whether source and cell country codes disagree; null if not comparable
    units: none

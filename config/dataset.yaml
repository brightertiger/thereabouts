    units: none
  - name: license
    type: string
    nullable: false
    meaning: Upstream licence identifier
    units: none
  - name: provenance
    type: string
    nullable: false
    meaning: JSON source evidence and transformation provenance
    units: none
  - name: country_id
    type: string
    nullable: true
    meaning: Reconciled country place identifier
    units: none
  - name: place_id
    type: string
    nullable: true
    meaning: Uniquely matched reconciled place; null for ambiguous or unmatched observations
    units: none
  - name: link_status
    type: string
    nullable: true
    meaning: 'Identifier link status: matched, ambiguous, unmatched or pending'
    units: none
    values:
    - value: matched
      meaning: Exactly one candidate place; place_id is set
    - value: ambiguous
      meaning: Several candidate places; all are in place_ids and place_id is null
    - value: unmatched
      meaning: No candidate place was found
    - value: pending
      meaning: The row refers to a country that is expected in the release but was not
        reconciled in this build
    values_from:
    - pipeline/engines/cells/code_links.py
  - name: link_method
    type: string
    nullable: true
    meaning: Rule used for the identifier link
    units: none
    values:
    - value: source country code
      meaning: The row's own country code identifies the country
    - value: explicit code or administrative crosswalk
      meaning: The published subdivision code maps to a place through the code crosswalk
    - value: GeoNames administrative identity
      meaning: The row's GeoNames identifier identifies the place
    - value: exact country-scoped administrative alias
      meaning: The normalized name equals a place alias within the same country
    - value: source-qualified administrative alias
      meaning: A name qualified by its source administrative context equals a place alias
    - value: territory fixed-line prefix language
      meaning: Candidate countries were narrowed by the territory's fixed-line numbering
        pattern
    - value: no numbering-pattern support; retained source candidates
      meaning: No numbering pattern could narrow the candidates, so every source country
        is kept

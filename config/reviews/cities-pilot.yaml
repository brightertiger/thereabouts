# (policy_fingerprint). Evaluation and the lookups manifest fail on any
# boundary loss that no exception below matches exactly.
#
# A boundary exception credits one examined loss of one original boundary:
#   country, city_id   the city whose accepted boundary lost cells
#   lost_cells         how many of its cells another city now answers
#   lost_to            those cells counted by the city that now answers them
#   cells              each lost cell the evaluation report lists (its
#                      loss_examples: the first ten in H3 order), mapped to the
#                      city that now answers it
#   boundary_origins   the boundary's source areas as stable upstream records:
#                      the Overture area's whole-feature source without its
#                      version (osm:r134579), otherwise <source>:<source_id>,
#                      with #<part> for a split geometry part above 0. Never the
#                      reconcile area IDs, which every rebuild renumbers.
#   reason, reference  the reviewer's explanation and evidence
# A loss is credited only when every field agrees. The evaluation report lists
# each remaining loss with its origins. Area numbers inside reference texts are
# those of the reviewed build, kept as written.

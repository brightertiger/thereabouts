name: Node
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the approved tagged 0.1.0 artifact
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  qualify:
    strategy:
      matrix:
        node: ["22", "24"]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: clients/node/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99"
          targets: wasm32-unknown-unknown
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked --all-extras
      - run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - working-directory: clients/node
        run: |
          npm ci --ignore-scripts
          npm run build
          npm test
          npm run check
          npm run format
          npm pack
      - uses: actions/upload-artifact@v4
        with:
          name: node-package-${{ matrix.node }}
          path: clients/node/thereabouts-0.1.0.tgz
  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && startsWith(github.ref, 'refs/tags/v')
    needs: qualify
    runs-on: ubuntu-24.04
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - name: Require the tag to match the package version
        run: node -e 'if (process.env.GITHUB_REF_NAME !== "v" + require("./clients/node/package.json").version) process.exit(1)'
      - uses: actions/download-artifact@v4
        with:
          name: node-package-24
          path: artifact
      # Owner configures npm trusted publishing; there are no repository tokens.
      # A bare "dir/file" argument is parsed as a GitHub shorthand; ./ makes it a path.
      - run: npm publish ./artifact/thereabouts-0.1.0.tgz --provenance --access public

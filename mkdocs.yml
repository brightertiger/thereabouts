site_name: Thereabouts
site_description: >-
  Thereabouts adds geographic context to a place reference without a network
  call or an API key. Queries run offline against data you install once.
site_url: https://brightertiger.github.io/thereabouts/
repo_url: https://github.com/brightertiger/thereabouts
repo_name: brightertiger/thereabouts
edit_uri: edit/main/docs/
docs_dir: docs

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.tabbed:
      alternate_style: true

extra:
  analytics:
    provider: google
    property: !ENV [GOOGLE_ANALYTICS_KEY, ""]
  consent:
    title: Cookie consent
    description: >-
      This site uses cookies to measure visits and improve the documentation.
      You can accept or reject analytics cookies.

nav:
  - Home: index.md
  - Users:
      - Python client: clients/python.md
      - Node client: clients/node.md
      - Command line: clients/cli.md
      - MCP server: clients/mcp.md
      - Installing data: clients/data-install.md
      - Licences: licenses.md
  - Dataset:
      - Dataset guide: dataset/README.md
      - Pack format: dataset/pack-format.md
      - Data dictionary: dataset/DATA_DICTIONARY.md
      - Code packs: dataset/code-packs.md
  - Maintainers:
      - Documentation index: README.md
      - Client release: clients/release.md
      - Client status: clients/status.md
      - Pipeline guide: pipeline/README.md
      - City policy: pipeline/city-policy.md
      - Release procedure: pipeline/release-procedure.md
      - Registry submission: pipeline/release-registry-pr.md

[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "thereabouts"
version = "0.1.0"
description = "Offline geographic context from a shared Rust core"
readme = "clients/python/thereabouts/README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["numpy>=2.0,<2.4"]

[project.optional-dependencies]
mcp = ["mcp==2.2.0"]

[project.scripts]
thereabouts = "thereabouts.cli:main"

[dependency-groups]
pipeline = [
    "omegaconf==2.3.0",
    "fsspec>=2026.9,<2027",
    "psutil>=7,<8",
    { include-group = "acquire" },
    "scipy>=1.14,<1.17",
    # The s3:// publication driver; tests publish to memory:// and file:// only.
    "s3fs>=2026.9,<2027",
]
dev = [
    { include-group = "pipeline" },
    "types-PyYAML",
    "types-psutil>=7,<8",
    "mcp==2.2.0",
    "maturin>=1.9,<2",
    "platformdirs>=4,<5",
    "pytest>=8,<10",
    "ruff>=0.11,<1",
    "mypy>=1.15,<2",
    "types-shapely>=2.1",
    "pyarrow-stubs>=19",
    "types-regex>=2026.9.10.20260911",
]
acquire = [
    "h3>=4.3,<5",
    "pyarrow>=19,<24",
    "duckdb>=1.2,<2",
    "shapely>=2.1,<3",
    "pyshp>=2.3,<3",
    "regex>=2024.11,<2027",
    "gcsfs>=2026.10.0",
]

[tool.maturin]
python-source = "clients/python"
module-name = "thereabouts._core"
manifest-path = "core/thereabouts-py/Cargo.toml"
features = ["pyo3/extension-module", "writer"]
include = ["clients/python/thereabouts/py.typed", "clients/python/thereabouts/_core.pyi"]

[tool.pytest.ini_options]
addopts = "--basetemp=.cache/pytest -m 'not world'"
testpaths = ["tests"]
# World tests need a built world release; run them with `-m world`.
markers = ["world: requires an explicitly built world pack"]

[tool.ruff]
src = [".", "clients/python"]
target-version = "py311"
line-length = 88
extend-exclude = ["docs", "graft", "data", "eval", "examples/ground-truth", "notes"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "C90", "PLR0913", "PERF", "S608"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.pylint]
max-args = 7

# A ratchet: the files that broke these rules when they were added. Fix a file
# and remove its entry; never add one.
[tool.ruff.lint.per-file-ignores]
"clients/python/thereabouts/mcp_service/server.py" = ["C901"]
"pipeline/arguments.py" = ["C901"]
"pipeline/config/loader.py" = ["C901"]
"pipeline/config/release.py" = ["C901"]
"pipeline/engines/cells/inventory.py" = ["S608"]
"pipeline/engines/cells/joins.py" = ["S608"]
"pipeline/engines/cells/metrics.py" = ["S608"]
"pipeline/engines/cities/build.py" = ["C901", "PLR0913"]
"pipeline/engines/names/build.py" = ["S608"]
"pipeline/engines/plate_country/evidence.py" = ["PERF401"]
"pipeline/engines/reconcile/areas.py" = ["C901"]
"pipeline/engines/reconcile/evaluation.py" = ["PLR0913"]
"pipeline/engines/reconcile/inputs.py" = ["S608"]
"pipeline/engines/reconcile/matching.py" = ["S608"]
"pipeline/migration/candidates.py" = ["C901"]
"pipeline/migration/dependencies.py" = ["C901"]
"pipeline/migration/inventory.py" = ["C901"]
"pipeline/pins/cli.py" = ["C901"]
"pipeline/pins/workspace.py" = ["C901"]
"pipeline/release/publish.py" = ["C901"]
"pipeline/release/tables.py" = ["C901"]
"pipeline/runtime/code.py" = ["C901"]
"pipeline/runtime/execution.py" = ["C901"]
"pipeline/runtime/ledger.py" = ["S608"]
"pipeline/runtime/resources.py" = ["PLR0913"]
"pipeline/sources/geoboundaries/geojson.py" = ["C901"]
"pipeline/sources/geoboundaries/rows.py" = ["PLR0913"]
"pipeline/sources/ghsl.py" = ["S608"]
"pipeline/sources/plates/reader.py" = ["C901"]
"pipeline/sources/plates/rules.py" = ["C901"]
"pipeline/sources/shared/lookup_schemas.py" = ["PERF403"]
"pipeline/sources/shared/schemas.py" = ["C901", "PERF403"]
"pipeline/stages/lookup_manifest.py" = ["PERF401"]
"pipeline/stages/lookups.py" = ["PERF401"]
"pipeline/storage/transfer.py" = ["PLR0913"]
"tests/e2e/driver.py" = ["C901"]
"tests/pipeline/pilot_inputs.py" = ["S608"]
"tests/pipeline/reconciliation/conftest.py" = ["PLR0913"]
"tests/pipeline/test_discovery_refresh.py" = ["PERF401"]
"tests/pipeline/test_duckdb_order.py" = ["PERF401"]
"tests/tools/build_core_vectors.py" = ["PERF401"]
"tests/tools/build_ip_vectors.py" = ["PERF401"]
"tests/tools/build_phone_sample.py" = ["PERF401"]
"tests/tools/build_sample_pack.py" = ["C901"]
"tests/tools/forward_sample.py" = ["C901"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["clients/python", "pipeline", "tests"]

# SciPy spatial and the build-only pyshp reader do not ship typing.
[[tool.mypy.overrides]]
module = ["scipy.spatial", "shapefile", "h3.*"]
ignore_missing_imports = true

[tool.uv]
# Rust edits must invalidate uv's editable-wheel cache as well as Python metadata.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "core/Cargo.toml" },
    { file = "core/Cargo.lock" },
    { file = "core/thereabouts-core/Cargo.toml" },
    { file = "core/thereabouts-py/Cargo.toml" },
    { file = "core/thereabouts-cli/Cargo.toml" },
    { file = "core/thereabouts-cli/src/**/*.rs" },
    { file = "core/thereabouts-cli-core/Cargo.toml" },
    { file = "core/thereabouts-cli-core/src/**/*" },
    { file = "core/thereabouts-writer/Cargo.toml" },
    { file = "core/thereabouts-writer/src/**/*.rs" },
    { file = "core/thereabouts-core/src/**/*.rs" },
    { file = "core/thereabouts-py/src/**/*.rs" },
]
# fsspec backends are narrowed to the storage Protocol at their boundary.
[[tool.mypy.overrides]]
module = ["fsspec.*"]
ignore_missing_imports = true

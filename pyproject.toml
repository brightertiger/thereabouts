[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "thereabouts"
version = "0.1.0"
description = "Offline H3 city, state and country lookup"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0,<2.4", "h3>=4.3,<5"]

[dependency-groups]
dev = [
    { include-group = "acquire" },
    "scipy>=1.14,<1.17",
    "pytest>=8,<10",
    "ruff>=0.11,<1",
    "mypy>=1.15,<2",
    "types-shapely>=2.1",
    "pyarrow-stubs>=19",
    "types-regex>=2026.9.10.20260911",
]
acquire = [
    "pyarrow>=19,<24",
    "duckdb>=1.2,<2",
    "shapely>=2.1,<3",
    "pyshp>=2.3,<3",
    "regex>=2024.11,<2027",
]

[tool.hatch.build.targets.wheel]
packages = ["src/thereabouts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["world: requires an explicitly built world pack"]

[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = ["docs", "graft", "data", "eval"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "build_data", "benchmarks", "tests"]

# SciPy spatial and the build-only pyshp reader do not ship typing.
[[tool.mypy.overrides]]
module = ["scipy.spatial", "shapefile", "h3.*"]
ignore_missing_imports = true

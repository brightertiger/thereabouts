[build-system]
requires = ["setuptools>=77,<81", "wheel>=0.45,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "thereabouts"
version = "0.1.0"
description = "Offline H3 city, state and country lookup"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0,<2.4", "h3>=4.3,<5"]

[project.optional-dependencies]
mcp = ["mcp==2.2.0"]

[project.scripts]
thereabouts = "thereabouts.cli:main"

[dependency-groups]
dev = [
    "omegaconf==2.3.0",
    "fsspec>=2026.9,<2027",
    "types-PyYAML",
    "psutil>=7,<8",
    "types-psutil>=7,<8",
    "mcp==2.2.0",
    "Cython==3.3.0",
    "setuptools>=77,<81",
    "types-setuptools",
    { include-group = "acquire" },
    "scipy>=1.14,<1.17",
    "pytest>=8,<10",
    "ruff>=0.11,<1",
    "mypy>=1.15,<2",
    "types-shapely>=2.1",
    "pyarrow-stubs>=19",
    "types-regex>=2026.9.10.20260911",
]
acquire = [
    "pyarrow>=19,<24",
    "duckdb>=1.2,<2",
    "shapely>=2.1,<3",
    "pyshp>=2.3,<3",
    "regex>=2024.11,<2027",
    "gcsfs>=2026.10.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
thereabouts = ["py.typed", "reading/*.pyi"]

[tool.setuptools.exclude-package-data]
"*" = ["*.pyx", "*.c"]

[tool.cibuildwheel]
build = ["cp311-*", "cp312-*", "cp313-*", "cp314-*"]
skip = ["*-musllinux_*"]
test-command = "python {project}/tests/wheel_smoke.py {project}/tests/fixtures/serving cython"

[tool.cibuildwheel.linux]
archs = ["auto64"]

[tool.cibuildwheel.macos]
archs = ["auto"]

[tool.cibuildwheel.windows]
archs = ["AMD64"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["world: requires an explicitly built world pack"]

[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = ["docs", "graft", "data", "eval"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "pipeline", "benchmarks", "tests", "setup.py"]

# SciPy spatial and the build-only pyshp reader do not ship typing.
[[tool.mypy.overrides]]
module = ["scipy.spatial", "shapefile", "h3.*"]
ignore_missing_imports = true

# fsspec backends are narrowed to the storage Protocol at their boundary.
[[tool.mypy.overrides]]
module = ["fsspec.*"]
ignore_missing_imports = true

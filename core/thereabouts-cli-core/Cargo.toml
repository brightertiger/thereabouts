[package]
name = "thereabouts-cli-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
sha2 = "0.10"
thereabouts-core = { path = "../thereabouts-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
thiserror = "2"
unicode-width = "0.2"
# Pure-Rust zstd decoding builds for wasm32; only archive creation uses the C library.
ruzstd = { version = "0.9", default-features = false, features = ["std"] }
zstd = { version = "0.13", optional = true }

[features]
# Deterministic archive creation for the release pipeline (through thereabouts-py).
create = ["dep:zstd"]

[dev-dependencies]
zstd = "0.13"
tempfile = "3"

[package]
name = "thereabouts-py"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "_core"
crate-type = ["cdylib", "rlib"]
# Extension behavior is tested from its Python host in tests/core.
# An empty Rust harness would require a separately discoverable libpython.
test = false
doctest = false

[lints]
workspace = true

[dependencies]
thereabouts-cli = { path = "../thereabouts-cli" }
thereabouts-core = { path = "../thereabouts-core" }
pyo3 = { version = "0.26", features = ["abi3-py311"] }
numpy = "0.26"
serde_json = "1"

[features]
writer = ["dep:thereabouts-writer"]

[dependencies.thereabouts-writer]
path = "../thereabouts-writer"
optional = true
